; PlatformIO project config — Enjin2 Arduino LCD Demo
; Board: Freenove ESP32-S3-WROOM FNK0104 (N16R8)
; Display: ILI9341 320x240 SPI LCD

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Flash & PSRAM configuration (N16R8 module)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

; Dependencies
lib_deps =
    bodmer/TFT_eSPI

; Build flags
build_flags =
    -DENJIN2_BUILD_LUA=1
    -DENJIN2_CANVAS_W=320
    -DENJIN2_CANVAS_H=240

    ; TFT_eSPI configuration — matches Freenove FNK0104A official setup
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DSPI_FREQUENCY=40000000

build_unflags =
    -std=gnu++11
    -fno-rtti

build_src_flags =
    -std=gnu++17
