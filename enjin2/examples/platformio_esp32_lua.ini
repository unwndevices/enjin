# PlatformIO configuration for ESP32 Lua integration
# Copy this to your project's platformio.ini file

[env:esp32s3-lua]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

# ESP32-S3 specific settings
board_build.flash_mode = qio
board_build.psram_type = qspi
board_build.memory_type = qspi_opi

# Build flags for Lua integration
build_flags = 
    -DESP32
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1
    -DENJIN2_BUILD_LUA=1
    -DLUA_USE_ESP32
    # Memory optimization flags
    -Os
    -ffunction-sections
    -fdata-sections
    # Lua-specific flags
    -DLUA_32BITS
    -DLUA_USE_C89
    -DLUA_COMPAT_5_2

# Libraries and dependencies
lib_deps = 
    # NodeMCU Lua for ESP32 (example)
    https://github.com/nodemcu/nodemcu-firmware.git#dev-esp32
    # Or ESP-IDF Lua component
    # lua@^5.4.0
    
    # Enjin2 dependencies
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit SSD1306@^2.5.0

# ESP-IDF specific configuration
board_build.partitions = partitions.csv

# Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

# Upload settings
upload_speed = 921600

[env:esp32-lua-minimal]
# Minimal ESP32 (non-S3) configuration for testing
platform = espressif32
board = esp32dev
framework = espidf

build_flags = 
    -DESP32
    -DENJIN2_BUILD_LUA=1
    -DLUA_USE_ESP32
    -Os
    -DLUA_32BITS

lib_deps = ${env:esp32s3-lua.lib_deps}

monitor_speed = 115200